# ==============================================================================
# Alpha Prod Orbit: Kernel Sysctl & Performance Optimization Profile
# Architecture: AMD Ryzen 5 3450U / 21GB RAM / zram Swap / Btrfs NVMe + ext4 HDD
# ==============================================================================
#
# PURPOSE:
# Optimize Linux kernel networking, memory management, and storage writeback
# for high-throughput media streaming (Jellyfin, Tailscale WireGuard).
#
# INSTALLATION:
#   1. Copy to system sysctl directory:
#        sudo cp /run/media/banana/Alpha/project/alpha/alpha-prod-orbit/99-orbit-network.conf /etc/sysctl.d/
#
#   2. Ensure the BBR congestion control module is loaded at boot:
#        echo "tcp_bbr" | sudo tee /etc/modules-load.d/bbr.conf
#        sudo modprobe tcp_bbr
#
#   3. Apply sysctl settings immediately:
#        sudo sysctl --system
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. WireGuard & UDP Buffer Sizing (Tailscale Streaming Optimization)
# ------------------------------------------------------------------------------
# Prevent UDP packet drop under bursty multi-stream HLS/DASH delivery over WireGuard.
# Increases maximum socket receive and transmit buffers to 8 MB.
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 2097152

# Increase network device input queue to absorb bursty inter-container packets
net.core.netdev_max_backlog = 10000

# ------------------------------------------------------------------------------
# 2. TCP Congestion Control & Packet Pacing (BBR + FQ)
# ------------------------------------------------------------------------------
# Fair Queueing (FQ) provides packet pacing, eliminating packet micro-bursts.
# BBR (Bottleneck Bandwidth and RTT) optimizes throughput and latency over Wi-Fi/WAN,
# drastically reducing buffering wheels compared to traditional loss-based Cubic.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP buffer tuning (min, default, max bytes: up to 8 MB)
net.ipv4.tcp_rmem = 4096 87380 8388608
net.ipv4.tcp_wmem = 4096 65536 8388608

# Enable TCP Fast Open for client and server (reduces handshake RTT)
net.ipv4.tcp_fastopen = 3

# Enable Window Scaling and Selective Acknowledgements
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_sack = 1

# ------------------------------------------------------------------------------
# 3. Virtual Memory & zram Swap Calibration
# ------------------------------------------------------------------------------
# Default swappiness of 150 aggressively pushes memory into zram prematurely.
# Lowering to 60 balances RAM usage, keeping working sets in uncompressed DDR4 memory
# while still utilizing zram for true cold pages.
vm.swappiness = 60

# Reduce VFS cache pressure from default 100 to 50.
# Prioritizes keeping directory dentries and inodes in RAM, vastly speeding up
# Jellyfin, Seerr, and Radarr/Sonarr media library directory walks on HDD.
vm.vfs_cache_pressure = 50

# Smooth dirty memory writebacks to avoid large disk flush stalls.
# Flush background dirty memory at 5% of RAM; force synchronous writeback at 10%.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# ------------------------------------------------------------------------------
# 4. Connection Tracking & File Descriptors
# ------------------------------------------------------------------------------
# Ensure ample connection tracking capacity for containerized microservices & P2P
net.netfilter.nf_conntrack_max = 131072
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
